watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
      - primary
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      round_corners: false
      round_corners_type: normal
      border_color: system
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 34
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
        - quick_launch
        - active_window
      center:
        - clock
      right:
        - media
        - systray
        - cpu
        - memory
        - github
        - update_check
        - open_meteo
        - bluetooth
        - microphone
        - volume
        - notifications
        - bin
        - power_menu
widgets:
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%H:%M%p | %A %d %b %Y}<span>{alarm}</span>'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: center
        direction: down
        extended: true
        show_years: true
        show_holidays: true
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: '<span>{icon}</span>'
      label_alt: '<span>{icon}</span>{level}'
      tooltip: true
      icons:
        "muted": "\ueee8" # Icon for muted
        "10": "\uf026"  # Icon for 0-10% volume
        "30": "\uf027"  # Icon for 11-30% volume
        "60": "\uf027"  # Icon for 31-60% volume
        "100": "\uf028"
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\ueb71"
          toggle_up: "\ueb6e"
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "\udb83\udd59"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "\u23fb"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
          - "\U000F0341"
          - Lock
        signout:
          - "\U000F0343"
          - Sign out
        sleep:
          - "\U000F0904"
          - Sleep
        hibernate:
          - "\U000F0901"
          - Hibernate
        restart:
          - "\U000F0453"
          - Restart
        shutdown:
          - "\U000F0906"
          - Shut Down
        cancel:
          - ''
          - Cancel
  cpu:
    type: yasb.cpu.CpuWidget
    options:
      label: '<span></span> {info[percent][total]}%'
      label_alt: '{info[freq][current]} MHz'
      update_interval: 2000
      hide_decimal: true
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  memory:
    type: yasb.memory.MemoryWidget
    options:
      label: '<span></span> {virtual_mem_free}'
      label_alt: '<span></span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%'
      update_interval: 5000
      hide_decimal: true
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
  quick_launch:
    type: yasb.quick_launch.QuickLaunchWidget
    options:
      label: "\uea6d"
      search_placeholder: Search applications...
      max_results: 30
      show_icons: true
      icon_size: 16
      compact_text: true
      providers:
        apps:
          enabled: true
          prefix: '*'
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
      popup:
        width: 720
        height: 480
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        dark_mode: true
      callbacks:
        on_left: toggle_quick_launch
      keybindings:
        - keys: alt+space
          action: toggle_quick_launch
          screen: primary
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: >-
        [class_name='{win[class_name]}' exe='{win[process][name]}'
        hwnd={win[hwnd]}]
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: ...
      monitor_exclusive: false
  systray:
    type: yasb.systray.SystrayWidget
    options:
      class_name: systray
      label_collapsed: 
      label_expanded: 
      label_position: right
      pin_click_modifier: ctrl
      show_unpinned: false
      show_battery: false
      show_volume: false
      icon_size: 16
      use_hook: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0
  open_meteo:
    type: yasb.open_meteo.OpenMeteoWidget
    options:
      label: '<span></span>{temp}'
      label_alt: '{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}'
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: metric
      callbacks:
        on_left: toggle_card
        on_middle: do_nothing
        on_right: toggle_label
      icons:
        sunnyDay: 
        clearNight: 
      weather_card:
        blur: true
        alignment: right
        direction: down
        icon_size: 32
        show_hourly_forecast: true
        time_format: 24h
        hourly_point_spacing: 76
        hourly_icon_size: 16
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: '#8EAEE8'
        current_line_width: 1
        current_line_style: dot
        hourly_forecast_buttons:
          enabled: true
        weather_animation:
          enabled: true
          snow_overrides_rain: true
          temp_line_animation_style: both
          rain_effect_intensity: 1
          snow_effect_intensity: 1
          scale_with_chance: true
  github:
    type: yasb.github.GithubWidget
    options:
      label: <span></span>
      label_alt: 'Notifications {data}'
      max_notification: 50
      notification_dot:
        enabled: true
        corner: top_right
        color: '#ef4747'
        margin:
          - 0
          - 3
      only_unread: false
      show_comment_count: true
      max_field_size: 54
      update_interval: 300
      icons:
        comment: "\uea6b"
      menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: center
        direction: down
        show_categories: true
        categories_order:
          - Issue
          - PullRequest
          - CheckSuite
          - Release
          - Discussion
  microphone:
    type: yasb.microphone.MicrophoneWidget
    options:
      label: '<span>{icon}</span>'
      label_alt: '<span>{icon}</span> {level}'
      mute_text: mute
      icons:
        normal: "\uf130"
        muted: "\uf131"
      mic_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
      callbacks:
        on_left: toggle_mic_menu
        on_middle: toggle_label
        on_right: toggle_mute
  media:
    type: yasb.media.MediaWidget
    options:
      label: '{title}{s}{artist}'
      label_alt: '{title}'
      separator: ' - '
      hide_empty: true
      callbacks:
        on_left: toggle_media_menu
        on_middle: do_nothing
        on_right: do_nothing
      max_field_size:
        label: 25
        label_alt: 20
      show_thumbnail: true
      controls_only: false
      controls_left: true
      controls_hide: false
      thumbnail_alpha: 100
      thumbnail_padding: 10
      thumbnail_edge_fade: true
      icons:
        prev_track: "\uf04a"
        next_track: "\uf04e"
        play: "\ueb2c"
        pause: "\uf04c"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: center
        direction: down
        thumbnail_corner_radius: 6
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 30
        show_volume_slider: true
      scrolling_label:
        enabled: true
        style: bounce
        update_interval_ms: 40
  bin:
    type: yasb.recycle_bin.RecycleBinWidget
    options:
      label: '<span>{icon}</span> {items_size}'
      label_alt: 'Items {items_count}, Total size ({items_size})'
      icons:
        bin_empty: "\U000F0A7A"
        bin_filled: "\U000F0A79"
      callbacks:
        on_left: open_bin
        on_right: empty_bin
        on_middle: toggle_label
      show_confirmation: false
  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span> {device_count}"
      label_alt: "<span>{icon}</span> {device_name}"
    callbacks:
      on_left: "toggle_menu"
      on_right: "toggle_label"
    menu_config:
      blur: true
      alignment: "center"
  update_check:
    type: "yasb.update_check.UpdateCheckWidget"
    options:
      windows_update:
        enabled: true
        label: "<span>\uf0ab</span> {count}"
        interval: 1440
        exclude: []
      winget_update:
        enabled: true
        label: "<span>\uf0ab</span> {count}"
        interval: 240
        exclude: ["Microsoft.Edge"]
      scoop_update:
        enabled: true
        label: "<span>\uf0ab</span> {count}"
        interval: 240
        exclude: []